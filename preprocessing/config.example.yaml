# extract_npz.py 설정 예시
# 사용법: cp config.example.yaml config.yaml 후 아래 경로를 본인 서버에 맞게 수정
# config.yaml 자체는 .gitignore에 등록 (서버 경로 노출 방지)

# ---- 공통 (3DDFA 모델/렌더링) ----
model_path: /path/to/3DDFA/models/phase1_wpdc_vdc.pth.tar
tri_path:   /path/to/3DDFA/visualize/tri.mat
uv_path:    /path/to/3DDFA/uv_coords.npy

npz_root:    /path/to/npz_output   # 결과가 {npz_root}/ffpp, {npz_root}/df40, {npz_root}/celebdf 로 나뉘어 저장됨
uv_size: 256
out_size: 256
sigmas: [15.0, 80.0, 120.0]
num_workers: 40

# ---- FF++ 전용 ----
ffpp:
  json_path:    /path/to/deepfakebench/preprocessing/dataset_json/FaceForensics++.json
  base_img_dir: /path/to/deepfakebench/datasets/rgb

# ---- DF40 전용 ----
df40:
  json_dir: /path/to/DF40/json
  # 원본 JSON에 적힌 경로 접두사 -> 실제 로컬 경로로 치환하는 매핑
  path_prefix_map:
    "deepfakes_detection_datasets/FaceForensics++": /path/to/DF40/FaceForensics++
    "deepfakes_detection_datasets/DF40": /path/to/DF40

# ---- Celeb-DF 전용 ----
celebdf:
  json_path:    /path/to/deepfakebench/preprocessing/dataset_json/Celeb-DF-v1.json
  base_img_dir: /path/to/deepfakebench/datasets/rgb